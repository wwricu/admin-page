name: Build
on:
  pull_request:
    branches:
      - master
      - release
  workflow_dispatch:
jobs:
  github:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: 'npm'
      - run: |
          npm ci
          npm run lint
          npm run build --if-present
