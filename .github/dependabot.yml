# Version ranges do not gate Dependabot; `ignore` does.
# `ignore` also filters security update PRs, so a blocked fix shows up as an
# alert without a PR instead of silently disappearing.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: increase-if-necessary
    groups:
      ckeditor:
        patterns: ["ckeditor5", "@ckeditor/*"]
      tooling:
        patterns: ["eslint", "@eslint/*", "typescript-eslint", "eslint-plugin-*", "globals"]
      routine:
        patterns: ["*"]
        update-types: [patch, minor]
    ignore:
      # Patch releases only: frozen visual layer and 0.x packages.
      - dependency-name: antd
        update-types: [version-update:semver-minor, version-update:semver-major]
      - dependency-name: "@ant-design/icons"
        update-types: [version-update:semver-minor, version-update:semver-major]
      - dependency-name: antd-img-crop
        update-types: [version-update:semver-minor, version-update:semver-major]
      - dependency-name: typescript
        update-types: [version-update:semver-minor, version-update:semver-major]
      - dependency-name: "@vercel/config"
        update-types: [version-update:semver-minor, version-update:semver-major]
      - dependency-name: eslint-plugin-react-refresh
        update-types: [version-update:semver-minor, version-update:semver-major]
      # No major updates without a manual decision.
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
      - dependency-name: react-router-dom
        update-types: [version-update:semver-major]
      - dependency-name: "@eslint/js"
        update-types: [version-update:semver-major]
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      - dependency-name: "@types/react"
        update-types: [version-update:semver-major]
      - dependency-name: "@types/react-dom"
        update-types: [version-update:semver-major]
      - dependency-name: "@vitejs/plugin-react"
        update-types: [version-update:semver-major]
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      - dependency-name: eslint-plugin-react-hooks
        update-types: [version-update:semver-major]
      - dependency-name: typescript-eslint
        update-types: [version-update:semver-major]
      - dependency-name: vite
        update-types: [version-update:semver-major]
      - dependency-name: globals
        update-types: [version-update:semver-major]