version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: increase-if-necessary
    groups:
      routine:
        patterns: ["*"]
    allow:
      - dependency-name: "*"
        update-types: [version-update:semver-patch]
    ignore:
      # Pinned to the 48 line: 49 reworked the theme CSS that the dark overrides rely on.
      - dependency-name: ckeditor5
      - dependency-name: "@ckeditor/*"
